[build-system]
# Capped below 1.32 deliberately. hatchling 1.32.0, released 2026-08-11, raised
# the emitted Metadata-Version from 2.4 to 2.5; the publishing action is pinned
# by digest to pypa/gh-action-pypi-publish v1.14.0, whose twine rejects that
# with "'2.5' is not a valid metadata version". The 0.3.8 publish failed there
# after building and testing clean.
#
# The asymmetry is the actual defect: the action was pinned by digest while the
# backend that produces what it validates was unbounded, so a hatchling release
# uploaded hours earlier broke a release without a line of this repository
# changing. Raise this ceiling and the action pin together, never separately.
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "euredact"
version = "0.3.8"
description = "European PII redaction SDK — rule engine for 31 countries"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
authors = [
    { name = "JNJS" },
]
keywords = [
    "pii", "redaction", "gdpr", "privacy", "europe",
    "masking", "anonymization", "referential-integrity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
# Homepage is what PyPI renders first and what crawlers follow, so it points at
# the site rather than back at the repository the visitor just came from.
Homepage = "https://euredact.dev"
Documentation = "https://euredact.dev/docs"
Repository = "https://github.com/euredact/euredact"
# Per package. The repository root has no CHANGELOG.md, so the previous value
# 404ed on every PyPI page since the URLs were added.
Changelog = "https://github.com/euredact/euredact/blob/main/euredact-python/CHANGELOG.md"
Issues = "https://github.com/euredact/euredact/issues"

[project.optional-dependencies]
fast = ["pyahocorasick>=2.0.0", "google-re2>=1.1"]
cloud = []
coref = []
dev = [
    "pyahocorasick>=2.0.0",
    "google-re2>=1.1",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-benchmark",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/euredact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/euredact/rules/countries/*.py" = ["E501"]  # regex patterns are long
"src/euredact/rules/validators.py" = ["E501"]
"src/euredact/rules/suppressors.py" = ["E501"]
"src/euredact/rules/engine.py" = ["E501"]
"src/euredact/rules/matchers.py" = ["E501"]
"src/euredact/sdk.py" = ["E501"]
