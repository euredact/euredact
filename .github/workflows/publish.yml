name: Publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  build-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: euredact-python
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install build ".[dev]"
      - run: ruff check src/
      - run: python -m pytest tests/ -x -q
      - run: python -m build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: python-dist
          path: euredact-python/dist/

  build-ts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: euredact-ts
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish-python:
    needs: [build-python, build-ts]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist/

  publish-ts:
    needs: [build-python, build-ts]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: euredact-ts
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Node 20 ships npm 10, which predates OIDC trusted publishing. Kept to a
      # major range rather than @latest so a bad npm release cannot break the
      # release pipeline, and rather than a pin so it does not go stale.
      - run: npm install -g npm@^11
      - run: npm ci
      - run: npm run build
      # Authenticates via OIDC trusted publishing — no NPM_TOKEN. Requires a
      # trusted publisher on npmjs.com for this package: organisation
      # "euredact", repository "euredact", workflow "publish.yml", environment
      # blank (this job declares none; if one is configured there it must
      # match). Provenance is implicit under trusted publishing; the flag is
      # kept so the intent survives if the auth method ever changes back.
      - run: npm publish --access public --provenance
