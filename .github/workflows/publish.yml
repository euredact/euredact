name: Publish

on:
  release:
    types: [published]
  # Manual re-trigger. A `release` event replays the workflow file from the
  # commit the tag points at, so a fix pushed after the release is not picked
  # up by re-running that run — this is the way to publish with the current
  # workflow. It checks out the selected branch, so it ships whatever version
  # that branch declares: a recovery lever, not the normal path.
  workflow_dispatch:

permissions: {}

jobs:
  build-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: euredact-python
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install build ".[dev]"
      - run: ruff check src/
      - run: python -m pytest tests/ -x -q
      - run: python -m build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: python-dist
          path: euredact-python/dist/

  build-ts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: euredact-ts
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish-python:
    needs: [build-python, build-ts]
    runs-on: ubuntu-latest
    # Gates the mint-and-publish step behind the environment's protection rules
    # (required reviewers). Without it, anyone holding repo write could publish
    # to both registries unreviewed by cutting a release or dispatching this
    # workflow from any branch.
    #
    # REQUIRES matching configuration, or publishing fails closed:
    #   1. A repository environment named "release" (Settings -> Environments)
    #      with the reviewers who may approve a publish.
    #   2. PyPI trusted publisher for this project set to environment "release".
    #   3. npm trusted publisher for this package set to environment "release".
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: dist/
          # Makes the workflow idempotent: a half-failed release (PyPI up, npm
          # down) can be re-run whole without the PyPI job failing on a version
          # that is already published.
          skip-existing: true

  publish-ts:
    needs: [build-python, build-ts]
    runs-on: ubuntu-latest
    # See publish-python for what this requires on the registry side.
    environment: release
    defaults:
      run:
        working-directory: euredact-ts
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Node 20 ships npm 10, which predates OIDC trusted publishing. Pinned to
      # an exact version rather than a range: this job holds the npm OIDC
      # identity, so a compromised release anywhere in "^11" would run with the
      # credential that publishes the package. Bump deliberately.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      # This job re-checks-out rather than consuming build-ts's artifact, so on
      # workflow_dispatch it can resolve a different commit than the one that
      # was tested. Running the suite here means whatever is about to be
      # published is what passed.
      - run: npm test
      # Authenticates via OIDC trusted publishing — no NPM_TOKEN. Requires a
      # trusted publisher on npmjs.com for this package: organisation
      # "euredact", repository "euredact", workflow "publish.yml", environment
      # blank (this job declares none; if one is configured there it must
      # match). Provenance is implicit under trusted publishing; the flag is
      # kept so the intent survives if the auth method ever changes back.
      #
      # Skipped when the registry already serves this version, which is the
      # mirror of `skip-existing: true` on publish-python and makes a re-run of
      # the whole workflow idempotent in the other direction too. The 0.3.8
      # release is why: npm published from the tag and PyPI rejected the build,
      # so the recovery dispatch had to re-enter a job whose npm publish could
      # only fail with "cannot publish over the previously published versions"
      # — a red run reporting a registry that was already correct.
      #
      # `npm view` is the check rather than a build-local guess because the
      # registry is the only authority on what it already holds. It exits
      # non-zero for an unpublished version, so failure means "go ahead".
      - name: Publish to npm unless the version is already there
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "euredact@${version}" version >/dev/null 2>&1; then
            echo "euredact@${version} is already on the registry; skipping publish."
          else
            npm publish --access public --provenance
          fi
